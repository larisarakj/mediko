    <title>Japanese Listening Quiz</title>

    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --bg-color: #f8f9fa;
            --text-dark: #2d3436;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .header {
            text-align: center;
           margin: 120px auto 40px;
        }

        .header h1 {
            font-size: 2.8rem; /* ขยายขนาดหัวข้อให้ใหญ่ขึ้น */
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .quiz-card {
            background: white;
            border-radius: 24px;
            padding: 45px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            margin-bottom: 40px;
            border: 1px solid #eee;
            text-align: center;
        }

        .question-text {
            font-size: 2.2rem; /* ขนาดคำถามใหญ่พิเศษ */
            font-weight: 600;
            margin-bottom: 35px;
            color: #2c3e50;
            display: block;
        }

        .audio-section {
            margin-bottom: 40px;
        }

        .audio-btn {
            background-color: #ffffff;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 18px 45px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            margin: 0 auto;
            gap: 12px;
        }

        .audio-btn:hover {
            background-color: var(--primary-color);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.2);
        }

        .options-grid {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .option-btn {
            background: #fcfcfc;
            border: 2px solid #edf2f7;
            padding: 20px 25px;
            border-radius: 18px;
            font-size: 1.2rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Kanit', sans-serif;
            color: #444;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background-color: #f0f7ff;
            padding-left: 35px; /* Effect เมื่อเลื่อนเม้าส์ไปวาง */
        }

        .correct {
            background-color: var(--success-color) !important;
            color: white !important;
            border-color: var(--success-color) !important;
        }

        .wrong {
            background-color: var(--danger-color) !important;
            color: white !important;
            border-color: var(--danger-color) !important;
        }

        .score-display {
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
            color: var(--success-color);
            margin: 40px 0;
            display: none;
            padding: 20px;
            background: white;
            border-radius: 20px;
        }

        .restart-btn {
            background: var(--text-dark);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 15px;
            font-size: 1.3rem;
            cursor: pointer;
            margin: 20px auto;
            display: none;
            width: 100%;
            max-width: 300px;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 2rem; }
            .question-text { font-size: 1.6rem; }
            .quiz-card { padding: 30px 20px; }
        }

let score = 0;
let questions = [];

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function speak(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ja-JP';
    utterance.rate = 0.85; // ปรับให้ช้าลงเล็กน้อยเพื่อให้ฟังง่าย
    window.speechSynthesis.speak(utterance);
}

function startQuiz() {
    score = 0;
    document.getElementById('score-area').style.display = 'none';
    document.getElementById('restart-btn').style.display = 'none';
    questions = shuffle([...masterData]).slice(0, 10);
    renderQuiz();
    window.scrollTo(0,0);
}

function renderQuiz() {
    const area = document.getElementById('quiz-area');
    area.innerHTML = '';

    questions.forEach((q, idx) => {
        const options = generateChoices(q.th);
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.innerHTML = `
            <div class="question-text">คนไข้พูดว่าอะไร?</div>
            <div class="audio-section">
                <button class="audio-btn" onclick="speak('${q.jp}')">
                    <span>🔊</span> คลิกเพื่อฟังเสียง
                </button>
            </div>
            <div class="options-grid" id="opt-container-${idx}">
                ${options.map(opt => `<button class="option-btn" onclick="checkAnswer(this, '${opt}', '${q.th}', ${idx})">${opt}</button>`).join('')}
            </div>
        `;
        area.appendChild(card);
    });
}

function generateChoices(correct) {
    let others = masterData.map(d => d.th).filter(t => t !== correct);
    let choices = [correct];
    shuffle(others);
    choices.push(others[0], others[1]);
    return shuffle(choices);
}

function checkAnswer(btn, selected, correct, idx) {
    const container = document.getElementById(`opt-container-${idx}`);
    const buttons = container.querySelectorAll('.option-btn');
    
    buttons.forEach(b => b.disabled = true);

    if (selected === correct) {
        btn.classList.add('correct');
        score++;
    } else {
        btn.classList.add('wrong');
        buttons.forEach(b => {
            if (b.innerText === correct) b.classList.add('correct');
        });
    }

    const answeredCount = document.querySelectorAll('.option-btn:disabled').length / 3;
    if (answeredCount === 10) {
        const scoreArea = document.getElementById('score-area');
        scoreArea.innerHTML = `สรุปคะแนนของคุณ: ${score} / 10 คะแนน`;
        scoreArea.style.display = 'block';
        document.getElementById('restart-btn').style.display = 'block';
    }
}

startQuiz();
