<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversations - Mediko Voice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Farsan&family=Noto+Sans+Thai:wght@100..900&family=Zen+Kurenaido&display=swap');

        :root {
            --pink-staff: #ff85a2;
            --green-patient: #2ecc71;
            --blue-accent: #3498db;
            --gold-special: #f1c40f;
            --bg-light: #f0f4f8;
        }

        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 0;
        }

        .main-container {
            margin-top: 100px;
            padding: 20px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        h1.category-title {
            text-align: center;
            color: #2c3e50;
            font-size: 2.8rem;
            margin-bottom: 40px;
            padding: 20px;
            background: #c9cffd;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2.sub-category {
            font-size: 1.8rem;
            color: #2c3e50;
            margin: 50px 0 25px 0;
            padding-left: 20px;
            border-left: 10px solid var(--blue-accent);
            letter-spacing: 1px;
        }

        .conversation-card {
            background: white;
            border-radius: 30px;
            padding: 35px;
            margin-bottom: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .chat-item {
            margin-bottom: 45px;
            padding-bottom: 25px;
            border-bottom: 1.5px solid #f1f1f1;
        }

        .chat-item:last-child { border-bottom: none; }

        /* ชื่อผู้พูด ไฮไลท์โค้งเว้า */
        .speaker {
            display: inline-block;
            padding: 10px 30px;
            border-radius: 30px 30px 30px 0;
            color: white;
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .staff { background: linear-gradient(135deg, #ff85a2, #ff6b81); }
        .patient { background: linear-gradient(135deg, #2ecc71, #27ae60); }

        /* ขยายฟอนต์บทสนทนา */
        .jp {
            font-family: 'Zen Kurenaido', sans-serif;
            font-size: 2.8rem; /* ขยายใหญ่พิเศษ */
            color: #1a1a1a;
            margin: 15px 0 5px 0;
            line-height: 1.3;
        }

        .romaji {
            font-size: 1.9rem;
            color: #7f8c8d;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .th {
            font-size: 2.5rem; /* ใหญ่ชัดเจน */
            color: #34495e;
            font-weight: 500;
            line-height: 1.3;
        }

        audio {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.1));
        }

        /* --- Conversation Skit Special Style --- */
        .skit-container {
            background: linear-gradient(145deg, #2c3e50, #000000);
            color: white;
            padding: 50px 30px;
            border-radius: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 4px solid var(--gold-special);
            margin-top: 60px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .skit-container::before {
            content: "★ SPECIAL CONTENT ★";
            display: block;
            color: var(--gold-special);
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .skit-title {
            font-size: 3rem;
            color: #fff;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
        }

        .skit-container audio {
            max-width: 80%;
            height: 50px;
            background: #fff;
            border-radius: 50px;
            padding: 5px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .jp { font-size: 1.8rem; }
            .th { font-size: 1.3rem; }
            .skit-title { font-size: 2rem; }
            .main-container { padding: 15px; }
        }
    </style>
</head>
<body>

<header>
    <input type="checkbox" id="toggler">
    <label for="toggler" class="fas fa-bars" id="menu-btn"></label>
    <a href="index.html" class="logo">Mediko Voice<span>.</span></a>
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="conversation.html" class="active">Conversations</a>
        <a href="vocab.html">Vocabulary</a>
        <a href="test.html">Test</a>
        <a href="review.html">Review</a>
    </nav>
    <div class="icons">
        <a href="index.html" class="fas fa-house"></a>
        <a href="#" class="fas fa-user"></a>
    </div>
</header>


<section class="main-container" id="Review">
    <h1 class="category-title" style="background: #fdf2f2;">User <span>Reviews</span></h1>

    <div class="conversation-card" style="border-top: 6px solid var(--pink-staff);">
        <h2 style="margin-top: 0; color: var(--blue-accent); font-size: 1.8rem; margin-bottom: 25px;">
            <i class="fas fa-pen-nib"></i> แบ่งปันประสบการณ์ของคุณ
        </h2>
        
        <div id="cusdis_thread"
             data-host="https://cusdis.com"
             data-app-id="25a5e223-cdb8-4d18-bf05-2e7097f786c9"
             data-page-id="mediko_review_page"
             data-page-url="https://mediko-voice.vercel.app/review.html"
             data-page-title="Mediko Voice Review">
        </div>
    </div>

    <div class="divider-text">รีวิวที่ได้รับการอนุมัติแล้ว</div>

    <div id="reviews-display" class="reviews-list">
        <div class="conversation-card review-item-box">
            <div class="review-header">
                <span class="speaker patient">@Admin_Mediko</span>
                <div class="stars-display">
                    <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                </div>
            </div>
            <p class="th" style="font-size: 1.5rem; margin-top: 15px; color: #444;">
                ขอบคุณที่แวะมาเยี่ยมชม Mediko Voice นะคะ รีวิวของคุณจะปรากฏที่นี่หลังจากได้รับการตรวจสอบแล้วค่ะ!
            </p>
        </div>
    </div>
</section>

<script async defer src="https://cusdis.com/js/cusdis.es.js"></script>

</body>
</html>

<style>
    /* ส่วนฟอร์มรีวิว */
    .review-card-input {
        border-top: 6px solid var(--pink-staff);
        padding: 40px !important;
    }

    .rating-section {
        text-align: center;
        margin-bottom: 30px;
        padding: 20px;
        background: #f8fbff;
        border-radius: 20px;
    }

    .stars-input {
        font-size: 2.2rem;
        color: var(--gold-special);
        cursor: pointer;
    }

    .stars-input i {
        margin: 0 5px;
        transition: transform 0.2s ease;
    }

    .stars-input i:hover {
        transform: scale(1.2);
    }

    .input-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .modern-field {
        width: 100%;
        padding: 15px 20px;
        border: 2px solid #edf2f7;
        border-radius: 15px;
        font-family: 'Noto Sans Thai', sans-serif;
        font-size: 1.1rem;
        box-sizing: border-box;
        transition: 0.3s;
        background: #fff;
    }

    .modern-field:focus {
        border-color: var(--blue-accent);
        outline: none;
        box-shadow: 0 0 12px rgba(52, 152, 219, 0.15);
    }

    .modern-btn {
        width: 100%;
        margin-top: 25px;
        padding: 16px;
        background: linear-gradient(135deg, #3498db, #2980b9);
        color: white;
        border: none;
        border-radius: 15px;
        font-family: 'Noto Sans Thai', sans-serif;
        font-size: 1.3rem;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
    }

    .modern-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
        filter: brightness(1.1);
    }

    /* เส้นแบ่งและตกแต่ง */
    .divider-text {
        text-align: center;
        margin: 50px 0 30px;
        color: #7f8c8d;
        font-weight: 500;
        position: relative;
    }
    .divider-text::before, .divider-text::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 30%;
        height: 1px;
        background: #d1d9e6;
    }
    .divider-text::before { left: 0; }
    .divider-text::after { right: 0; }

    /* กล่องรีวิวที่แสดงผล */
    .review-item-box {
        border-left: 10px solid var(--green-patient);
        animation: fadeIn 0.5s ease-out forwards;
    }

    .review-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .stars-display {
        color: var(--gold-special);
        font-size: 1.1rem;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
        .review-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        .stars-input { font-size: 1.8rem; }
        .divider-text::before, .divider-text::after { width: 20%; }
    }
</style>

<script>
    let selectedRating = 0;

    // ระบบเลือกคะแนนดาว
    const starContainer = document.getElementById('star-rating');
    const stars = starContainer.querySelectorAll('i');

    stars.forEach(star => {
        star.addEventListener('click', () => {
            selectedRating = star.getAttribute('data-value');
            updateStars(selectedRating);
        });
    });

    function updateStars(val) {
        stars.forEach(s => {
            if (s.getAttribute('data-value') <= val) {
                s.classList.replace('far', 'fas');
            } else {
                s.classList.replace('fas', 'far');
            }
        });
    }

    // ระบบส่งข้อมูลและแสดงผล
    function submitReview() {
        const name = document.getElementById('user-nickname').value;
        const comment = document.getElementById('user-comment').value;
        
        if (!name.trim() || !comment.trim() || selectedRating == 0) {
            alert("กรุณากรอกข้อมูลให้ครบถ้วนและให้คะแนนดาวด้วยนะค๊า ✨");
            return;
        }

        const reviewList = document.getElementById('reviews-display');
        const newReview = document.createElement('div');
        newReview.className = 'conversation-card review-item-box';
        
        let starHtml = '';
        for(let i=1; i<=5; i++) {
            starHtml += i <= selectedRating ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>';
        }

        newReview.innerHTML = `
            <div class="review-header">
                <span class="speaker patient" style="margin-bottom:0;">@${name}</span>
                <div class="stars-display">${starHtml}</div>
            </div>
            <p class="th" style="font-size: 1.5rem; margin-top: 15px; color: #444;">${comment}</p>
        `;

        // เพิ่มรีวิวใหม่เข้าไปที่บนสุดของรายการ
        reviewList.prepend(newReview);

        // เคลียร์ค่าในฟอร์ม
        document.getElementById('user-nickname').value = "";
        document.getElementById('user-comment').value = "";
        selectedRating = 0;
        updateStars(0);

        // Scroll ไปดูรีวิวที่เพิ่งพิมพ์
        newReview.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
</script>
